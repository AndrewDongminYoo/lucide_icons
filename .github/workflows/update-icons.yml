name: Update Lucide icons

# New lucide-static releases are detected by Dependabot (.github/dependabot.yml)
# as a human-visible notification, but this workflow no longer needs it: the
# daily schedule self-checks `npm view lucide-static version` against
# pubspec.yaml and no-ops when already current. When a newer version is found,
# the icon set is regenerated and a PR is opened. Still dispatchable on demand.
on:
  workflow_dispatch:
  schedule:
    # Every 4 hours -- 6 runs a day, matching the sibling icon repos. Their
    # cadence is set by pub.dev's per-package publish rate limit; this package
    # has no publish.yml, but the mirrors are kept on one schedule.
    - cron: 0 */4 * * *

permissions:
  contents: write
  pull-requests: write

concurrency:
  # The queue guard reads the open-PR list, so two overlapping runs could both
  # see an empty queue and generate the same release. Never cancel in progress:
  # a run killed between merge and tag leaves the mirror half-advanced.
  group: update-lucide-icons
  cancel-in-progress: false

# Run Node-based actions on Node 24 to silence the Node 20 deprecation notice.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  update-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Pick the next lucide-static release to mirror
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current="$(grep -E '^version:' pubspec.yaml | awk '{print $2}')"
          # A package-side hotfix (e.g. 1.24.0+1) still tracks the same upstream
          # release; strip the build number so it doesn't reopen the update PR daily.
          current="${current%%+*}"
          echo "current=$current" >> "$GITHUB_OUTPUT"

          # One update PR at a time. An open PR is the head of the queue; opening
          # the next one before it lands would release versions out of order.
          # --limit: `gh pr list` fetches only 30 by default, and a guard that misses
          # the queue head is worse than no guard.
          open="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json headRefName \
            --jq '[.[] | select(.headRefName | startswith("chore/lucide-static-"))] | length')"
          if [ "$open" != 0 ]; then
            echo "An icon update PR is already open; waiting for it to land."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # One `npm view --json` carries both the ordered version list and the
          # dist-tags.
          meta="$(npm view lucide-static --json)"
          if ! jq -e --arg cur "$current" '.versions | index($cur) != null' >/dev/null <<<"$meta"; then
            # Upstream unpublished the version pubspec.yaml is on, so there is no
            # position to advance from. Guessing would regenerate an older release
            # and merge a downgrade onto main, whose tag already exists, leaving
            # nothing publishable. Fail loudly so a maintainer reconciles instead.
            echo "pubspec.yaml is on $current, which lucide-static no longer publishes."
            echo "Reconcile pubspec.yaml manually; refusing to guess the next release."
            exit 1
          fi

          # Advance one release at a time -- `npm view` lists versions in semver
          # order, so the next release is the entry after the current one -- but
          # never past the `latest` dist-tag. The version list alone does not say
          # what upstream considers released: @vscode/codicons holds latest at
          # 0.0.46-24 while publishing through 0.0.46-37 under `next`, and
          # mirroring that train would publish prereleases pub.dev does not
          # resolve by default.
          next="$(jq -r --arg cur "$current" '
            ."dist-tags".latest as $cap
            | .versions
            | index($cap) as $capIdx
            | index($cur) as $i
            | if $capIdx == null or $i >= $capIdx then empty else (.[$i + 1] // empty) end
          ' <<<"$meta")"
          if [ -z "$next" ]; then
            cap="$(jq -r '."dist-tags".latest' <<<"$meta")"
            if [ "$current" = "$cap" ]; then
              echo "Already on lucide-static@$current, upstream's latest; nothing to do."
            else
              echo "pubspec.yaml is on $current, at or past upstream's latest ($cap)."
              echo "Newer versions exist but upstream has not promoted them; waiting."
            fi
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "lucide-static@$next available (current: $current)."
            echo "next=$next" >> "$GITHUB_OUTPUT"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        if: steps.check.outputs.changed == 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        if: steps.check.outputs.changed == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Setup Flutter
        if: steps.check.outputs.changed == 'true'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Regenerate icon set
        if: steps.check.outputs.changed == 'true'
        env:
          NEW_VERSION: ${{ steps.check.outputs.next }}
        run: |
          flutter pub get
          bash tool/update_icons.sh "$NEW_VERSION"

      - name: Bump version and update changelog
        if: steps.check.outputs.changed == 'true'
        env:
          NEW_VERSION: ${{ steps.check.outputs.next }}
        run: |
          # Keep the package version in lockstep with lucide-static.
          sed -i -E "s/^version: .*/version: ${NEW_VERSION}/" pubspec.yaml

          # Derive added / removed icon names from the regenerated Dart file.
          ADDED="$(git diff -- lib/lucide_icons.dart \
            | grep -E '^\+[[:space:]]+static const IconData' \
            | sed -E 's/.*IconData[[:space:]]+([A-Za-z0-9]+).*/\1/' | sort -u || true)"
          REMOVED="$(git diff -- lib/lucide_icons.dart \
            | grep -E '^-[[:space:]]+static const IconData' \
            | sed -E 's/.*IconData[[:space:]]+([A-Za-z0-9]+).*/\1/' | sort -u || true)"
          export ADDED REMOVED

          python3 - "$NEW_VERSION" <<'PY'
          import os, sys, datetime

          version = sys.argv[1]
          date = datetime.date.today().isoformat()
          added = [n for n in os.environ.get("ADDED", "").split() if n]
          removed = [n for n in os.environ.get("REMOVED", "").split() if n]

          def names(items):
              return ", ".join(f"`{n}`" for n in items)

          lines = [f"## {version} - {date}", "", "### Added", "",
                   f"- Updated icon set to lucide-static@{version}."]
          if added:
              lines.append(f"- New icons: {names(added)}.")
          if removed:
              lines += ["", "### Removed", "", f"- Removed icons: {names(removed)}."]
          entry = "\n".join(lines) + "\n\n"

          with open("CHANGELOG.md", encoding="utf-8") as f:
              content = f.read()

          header = "# Changelog\n\n"
          if content.startswith(header):
              content = header + entry + content[len(header):]
          else:
              content = entry + content
          with open("CHANGELOG.md", "w", encoding="utf-8") as f:
              f.write(content)

          # Expose a short summary for the PR body.
          summary = []
          if added:
              summary.append(f"**Added ({len(added)}):** {names(added)}")
          if removed:
              summary.append(f"**Removed ({len(removed)}):** {names(removed)}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write("PR_SUMMARY<<EOF\n" + ("\n\n".join(summary) or "No icon constants changed.") + "\nEOF\n")
          PY

      - name: Format the regenerated files
        if: steps.check.outputs.changed == 'true'
        run: |
          # The vendored CSS and the generated changelog entry land unformatted,
          # and CI has no trunk-fmt-pre-commit hook, so run the repo's own
          # formatter here instead. --all skips trunk's changed-file detection,
          # which needs an upstream ref this shallow checkout lacks. Only the
          # launcher comes from the network; .trunk/trunk.yaml pins the CLI.
          curl https://get.trunk.io -fsSL | bash -s -- -y
          trunk fmt --all

      - name: Verify the package still analyzes
        if: steps.check.outputs.changed == 'true'
        run: flutter analyze

      - name: Run tests
        if: steps.check.outputs.changed == 'true'
        run: flutter test

      - name: Open pull request
        id: pr
        if: steps.check.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          base: main
          branch: chore/lucide-static-${{ steps.check.outputs.next }}
          commit-message: "feat(icons): update icon set to lucide-static@${{ steps.check.outputs.next }}"
          title: "feat(icons): update icon set to lucide-static@${{ steps.check.outputs.next }}"
          body: |
            Automated regeneration triggered by a new lucide-static release.

            - lucide-static: `${{ steps.check.outputs.current }}` → `${{ steps.check.outputs.next }}`

            ${{ env.PR_SUMMARY }}

            Generated by `.github/workflows/update-icons.yml`.
          labels: dependencies, icons
          delete-branch: true

      - name: Merge the pull request
        if: steps.pr.outputs.pull-request-number != ''
        env:
          # RELEASE_TOKEN only -- never github.token. A merge pushed with the
          # default token cannot trigger tag-release.yml, so the version would
          # land on main untagged and never reach pub.dev. Without the secret
          # the PR is left open for a manual merge, which is the current flow.
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          PR: ${{ steps.pr.outputs.pull-request-number }}
          PR_SHA: ${{ steps.pr.outputs.pull-request-head-sha }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "RELEASE_TOKEN is not configured; leaving PR #${PR} for a manual merge."
            exit 0
          fi
          # A plain merge, not --auto: this repo has no pull_request-triggered
          # workflow, so auto-merge would have no check to wait for. The steps
          # above are the gate. Add --auto once PR-time CI exists.
          # --match-head-commit: the tests above vouch for this SHA only, and the
          # merge releases immediately, so reject a head that moved since.
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash --delete-branch \
            --match-head-commit "$PR_SHA"
